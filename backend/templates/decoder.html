<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Securely decrypt your messages with DualCrypt — a modern decryption tool.">
    <title>Decrypter-Endec</title>
    <link rel="stylesheet" href="{{(url_for('static',filename='css/styleD.css'))}}">
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
        rel="stylesheet" />
</head>

<body>
    <div class="logocontainer">
        <h1>Endec</h1>
    </div>
    <div class="card">
        <div class="switch">
            <button class="switch-btn" data-mode="encrypt">Encrypt</button>
            <button class="switch-btn" data-mode="decrypt">Decrypt</button>
        </div>

        <form>
            <label for="message">Enter your encrypted message</label>
            <textarea id="emessage" name="message" rows="4" placeholder="Paste your encrypted message here"
                required></textarea>
            <div class="ePassword">
                <label for="password">Enter password(if any)</label>
                <input type="password" name="password" placeholder="•••••••••••" id="ePassword">
            </div>
            <button type="submit" id="decode">Decrypt</button>
        </form>

    </div>
    <!-- <div class="fill_pass">
        <div class="modal-container">
            <label for="pass">Please enter password</label>
            <input type="password" name="inp_password" placeholder="•••••••••••" id="password">
        </div> -->
    </div>
    <div class="modal-container">
        <div class="modal-content">
            <div class="output">
                <strong>Decrypted Message: <br></strong>
                <p id="dmessage">{{injected_message}}</p>
                <button class="copy-btn" data-target="dmessage" data-span="copied-decrypted"><svg
                        xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="15" height="15"
                        color="currentColor" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"
                        stroke-linejoin="round">
                        <path
                            d="M7 11V9C7 5.70017 7 4.05025 8.02513 3.02513C9.05025 2 10.7002 2 14 2C17.2998 2 18.9497 2 19.9749 3.02513C21 4.05025 21 5.70017 21 9V11C21 14.2998 21 15.9497 19.9749 16.9749C18.9497 18 17.2998 18 14 18C10.7002 18 9.05025 18 8.02513 16.9749C7 15.9497 7 14.2998 7 11Z" />
                        <path d="M3 6V15C3 18.2998 3 19.9497 4.02513 20.9749C5.05025 22 6.70017 22 10 22H17" />
                    </svg></button>
                <span class="copiedBtn" id="copied-decrypted"></span>
            </div>
            <div>
                <button id="close">close</button>
            </div>
        </div>
    </div>


    <script src="{{ url_for('static',filename='js/script.js')}}"></script>
</body>

</html>
