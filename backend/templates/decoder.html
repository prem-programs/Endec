<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Securely decrypt your messages with Endec — a modern client-side decryption tool.">
    <title>Decrypter-Endec</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<nav>
    <div class="logo"><span>Endec
    </span></div>
    <div class="nav-links">
        <a class="nav-link" href="#" target="_blank">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 19c-4.3 1.4-4.3-2.5-6-3m12 5v-3.5c0-1 .1-1.4-.5-2 2.8-.3 5.5-1.4 5.5-6a4.6 4.6 0 0 0-1.3-3.2 4.2 4.2 0 0 0-.1-3.2s-1.1-.3-3.5 1.3a12.3 12.3 0 0 0-6.2 0C6.5 2.8 5.4 3.1 5.4 3.1a4.2 4.2 0 0 0-.1 3.2A4.6 4.6 0 0 0 4 9.5c0 4.6 2.7 5.7 5.5 6-.6.6-.6 1.2-.5 2V21"/></svg>
            Source
        </a>
    </div>
</nav>

<header class="hero">
    <h1>Decrypt your <span class="em">Secret</span>.</h1>
    <p class="sub">Enter the encrypted ciphertext and password below to unlock and read your secure secret.</p>
</header>

<main>
    <div class="card" id="card">
        <!-- Manual Decryption Form -->
        <div class="encrypt-form" id="manualDecryptForm">
            <div class="field-wrap">
                <textarea id="emessage" placeholder="Paste the encrypted ciphertext here…"></textarea>
                <div class="cipher-strip" id="cipherStrip" style="display: none;">
                    <span class="lock-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
                    </span>
                    <span id="cipherText">waiting for input…</span>
                </div>
            </div>

            <div class="options">
                <div class="opt-pill expanded" id="pwPill">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
                    <input type="password" id="ePassword" placeholder="Enter password to decrypt" style="display: block; width: 100%;">
                </div>
            </div>

            <button class="cta" id="decode" type="button">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
                Decrypt Secret
            </button>
        </div>

        <!-- Decrypted Result State -->
        <div class="result modal_content" id="result">
            <div style="display:flex; align-items:center; gap:12px;">
                <div class="result-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                </div>
                <div>
                    <div class="result-title">Decrypted Secret</div>
                    <div class="result-sub">The message was successfully unlocked client-side.</div>
                </div>
            </div>

            <div class="link-box" style="margin-top: 15px;">
                <div class="decoder-box" id="dmessage"></div>
            </div>

            <div class="meta-row" style="margin-top: 10px;">
                <button class="copy-btn" data-target="dmessage" data-span="copied-decrypted" id="copyDecryptedBtn">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
                    Copy Plaintext
                </button>
                <span class="copiedBtn" id="copied-decrypted"></span>
            </div>

            <button class="new-btn" id="close" style="margin-top: 15px; width: 100%;">Close / Go Home</button>
        </div>
    </div>
</main>

<script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
