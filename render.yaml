services:
  - type: web
    name: endec
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn run:app
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DATABASE_URL
        fromDatabase:
          name: endec-db
          property: connectionString

databases:
  - name: endec-db
    plan: free
    databaseName: endec
    user: endec_user
